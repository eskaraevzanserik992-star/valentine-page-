<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A song that reminds me of us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        <div class="header-text">A song that reminds me of us ✨</div>
        
        <div class="player-body">
            <div class="vinyl-box">
                <div class="vinyl" id="vinylDisk">
                    <div class="vinyl-center"></div>
                </div>
            </div>

            <div class="song-title">Risk It All</div>
            <div class="artist-name">Bruno Mars</div>

            <div class="controls">
                <button class="play-btn" id="playButton">▶</button>
            </div>
        </div>
    </div>

    <script>
        const playButton = document.getElementById('playButton');
        const vinylDisk = document.getElementById('vinylDisk');
        
        // Музыка файлы осы жерде шақырылады
        const audio = new Audio('./sounds/music.mp3'); 
        let isPlaying = false;

        playButton.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play().then(() => {
                    vinylDisk.style.animationPlayState = 'running';
                    playButton.innerText = '⏸';
                    isPlaying = true;
                }).catch(err => {
                    alert("Музыка файлы табылмады немесе қосылмай тұр!");
                });
            } else {
                audio.pause();
                vinylDisk.style.animationPlayState = 'paused';
                playButton.innerText = '▶';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
